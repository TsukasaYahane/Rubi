[package]
name = "rubi-uwp"
description = "The UWP app: XAML built from Rust over rubi-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rubi"
path = "src/main.rs"

[target.'cfg(target_vendor = "uwp")'.dependencies]
rubi-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
windows-collections = "0.100"
windows-core = "0.100"
windows-future = "0.100"
windows-link = "0.100"
windows-time = "0.100"
