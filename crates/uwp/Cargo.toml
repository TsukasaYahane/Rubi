[package]
name = "rubi-uwp"
description = "The UWP app: XAML built from Rust over rubi-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rubi"
path = "src/main.rs"

# `state` is plain Rust and builds and tests anywhere (`cargo test -p rubi-uwp`).
[dependencies]
qrcode = { version = "0.14", default-features = false }
rubi-core.workspace = true
rubi-model.workspace = true
rubi-store.workspace = true
serde_json.workspace = true

[target.'cfg(target_vendor = "uwp")'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
windows-collections = "0.100"
windows-core = "0.100"
windows-future = "0.100"
windows-link = "0.100"
windows-numerics = "0.100"
windows-reference = "0.100"
windows-time = "0.100"
