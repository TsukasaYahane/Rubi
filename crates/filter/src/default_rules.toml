# Rubi 内置过滤规则表。
# verified = false 的规则基于推测字段，需抓包确认后改为 true（见 docs/design.md §12）。
# 用户的规则表以此为底，新版内置规则按 id 合并进去。

version = 1
source = "builtin"

[toggles]
promotion = true
ad = true
banner = true
goods = true
pinned_comment = true
commercial_penalty = false
non_video = true
watched = true
command_danmaku = true
show_advanced_danmaku = true
merge_jump = true
jump_marks = true
notice = true

# ---------- 推荐流 / 列表卡片 ----------

[[field_rules]]
id = "promotion.bihuo_card"
name = "必火推广 · 推荐流"
category = "promotion"
# 2026-11-03 抓包确认（www.bilibili.com 首页推荐 feed/rcmd，卡片右下角小火箭）：必火推广不是普通视频卡，
# 而是装着真视频的广告位：goto = "ad"，business_info.card_type = 82、creative_type = 1，
# business_info.archive 是被推广的视频，business_mark.type = 4 且 img_url 为火箭图标
# （bfs/sycp/mng/202203/3621990414ef….png）。普通广告卡 card_type = 0、creative_type = 2、
# business_mark.type = 2（文字「广告」）。放在 ad.goto 前，记录里写作必火推广而不是广告。
when = { op = "any", of = [{ op = "eq", path = "business_info.card_type", value = 82 }, { op = "eq", path = "business_info.business_mark.type", value = 4 }, { op = "exists", path = "business_info.archive" }] }
verified = true

[[field_rules]]
id = "ad.goto"
name = "广告卡片 · goto"
category = "ad"
when = { op = "in", path = "goto", values = ["ad", "ad_av", "ad_web", "ad_web_s", "ad_player", "ad_inline_av"] }
# 2026-10-31 抓包确认：网页推荐的广告卡 goto = "ad"，business_info.is_ad = true；普通视频卡 business_info 为 null。
verified = true

[[field_rules]]
id = "ad.business_info"
name = "广告卡片 · business_info"
category = "ad"
when = { op = "exists", path = "business_info" }
# 2026-10-31 抓包确认：网页推荐的广告卡 goto = "ad"，business_info.is_ad = true；普通视频卡 business_info 为 null。
verified = true

[[field_rules]]
id = "ad.app_card_goto"
name = "广告卡片 · card_goto"
category = "ad"
when = { op = "any", of = [{ op = "contains", path = "card_goto", text = "ad" }, { op = "contains", path = "card_type", text = "cm" }] }

[[field_rules]]
id = "promotion.bihuo"
name = "必火推广"
category = "promotion"
# 2026-11-02：用户在官方 App 见到 BV1RNJ16NEJX 带「必火推广」角标；同一视频的网页接口（view、view/detail、
# 相关推荐、搜索 search/type、视频页）都没有任何标记（spread_id = 0、biz_data / corner / rec_reason 为空），
# 角标只在 App 接口里。以下覆盖网页推荐的推荐理由与搜索结果的角标 / 推荐理由，网页一旦标出即可拦下。
when = { op = "any", of = [{ op = "eq", path = "is_ad", value = true }, { op = "exists", path = "ad_info" }, { op = "exists", path = "creative_id" }, { op = "contains", path = "rcmd_reason.content", text = "推广" }, { op = "contains", path = "rcmd_reason.content", text = "必火" }, { op = "contains", path = "rec_reason", text = "推广" }, { op = "contains", path = "rec_reason", text = "必火" }, { op = "contains", path = "corner", text = "推广" }, { op = "contains", path = "corner", text = "必火" }] }

[[field_rules]]
id = "promotion.goto_misc"
name = "推广卡片 · 游戏 / 直播 / 番剧"
category = "promotion"
when = { op = "in", path = "goto", values = ["game", "live", "bangumi", "pgc", "ogv"] }

[[field_rules]]
id = "commercial.flag"
name = "商业合作稿件"
category = "commercial"
action = { kind = "penalize", factor = 0.85 }
when = { op = "any", of = [{ op = "exists", path = "is_commercial" }, { op = "contains", path = "rcmd_reason.content", text = "商业合作" }] }

# ---------- 首页横幅与活动页：开关打开时全部隐藏 ----------

[[field_rules]]
id = "banner.all"
name = "首页横幅 / 活动页"
category = "banner"
target = "banner"
when = { op = "all", of = [] }
verified = true

# ---------- 视频页商品卡片：开关打开时全部隐藏 ----------

[[field_rules]]
id = "goods.all"
name = "视频页商品卡片"
category = "goods"
target = "goods"
when = { op = "all", of = [] }
verified = true

# ---------- 置顶评论：仅对置顶评论生效 ----------

[[field_rules]]
id = "comment.pinned_goods"
name = "置顶带货评论"
category = "pinned_comment"
target = "comment"
# 2026-10-31 抓包：jump_url 也用于搜索词高亮（extra.is_word_search）和番剧链接，不能整体判为带货；
# 商品链接一项的 extra 带 goods_prefetched_cache，正文常是 b23.tv/cm-… 商业短链。
# 2026-11-01：UP 置顶的淘宝商品链接是 b23.tv/mall-…，jump_url 带 extra.goods_item_id 与 app_package_name（不带 goods_prefetched_cache）。
when = { op = "any", of = [{ op = "exists", path = "content.jump_url.*.extra.goods_prefetched_cache" }, { op = "exists", path = "content.jump_url.*.extra.goods_item_id" }, { op = "contains", path = "content.message", text = "b23.tv/mall-" }, { op = "contains", path = "content.message", text = "b23.tv/cm-" }, { op = "contains", path = "content.message", text = "淘宝" }, { op = "contains", path = "content.message", text = "京东" }, { op = "contains", path = "content.message", text = "拼多多" }, { op = "contains", path = "content.message", text = "购买链接" }] }
verified = true

# ---------- 消息中心 ----------

[[field_rules]]
id = "notice.official_promo"
name = "营销私信（未关注账号的通知卡片）"
category = "ad"
target = "notice"
# 2026-10-31 抓包：msg_type = 10 是通知卡片，服务通知 / 社区中心 / 创作助手等官方账号也用它
# （system_msg_type = 7，带 account_info），不能整体隐藏。营销推送是非系统账号（system_msg_type = 0）、
# 未关注（is_follow = 0）的通知卡片，B 站自己也标为可折叠（can_fold = 1）。
when = { op = "all", of = [{ op = "eq", path = "last_msg.msg_type", value = 10 }, { op = "eq", path = "system_msg_type", value = 0 }, { op = "eq", path = "is_follow", value = 0 }] }
verified = true

# ---------- 热搜 ----------

[[field_rules]]
id = "hot_word.commercial"
name = "推广热搜词"
category = "ad"
target = "hot_word"
# 2026-10-31 抓包：s.search 热搜每条都有 stat_datas.is_commercial（字符串 "0"）；未见到 "1" 的样本。
when = { op = "any", of = [{ op = "eq", path = "stat_datas.is_commercial", value = "1" }, { op = "eq", path = "is_commercial", value = "1" }, { op = "exists", path = "ad_info" }] }

# ---------- 专栏 / 图文正文 ----------

[[field_rules]]
id = "article.promo_card"
name = "专栏里的带货 / 广告卡片"
category = "ad"
target = "article_block"
# 正文段落（para_type 6 是链接卡片）：商品卡、广告卡，以及正文里的 b23.tv/cm- 商业短链与购物平台链接。
when = { op = "any", of = [{ op = "contains", path = "link_card.card.type", text = "GOODS" }, { op = "exists", path = "link_card.card.goods" }, { op = "contains", path = "link_card.card.type", text = "AD" }, { op = "contains", path = "text.nodes.*.rich.jump_url", text = "b23.tv/cm-" }, { op = "contains", path = "text.nodes.*.rich.jump_url", text = "taobao.com" }, { op = "contains", path = "text.nodes.*.rich.jump_url", text = "jd.com" }] }
