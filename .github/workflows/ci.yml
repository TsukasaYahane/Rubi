name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  apk:
    name: release APK (size budget 15 MB)
    needs: rust
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 29.0.14206865
      APK_BUDGET_BYTES: 15728640
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;${NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Size budget
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          size=$(stat -c %s "$apk")
          echo "$apk: $size bytes (budget $APK_BUDGET_BYTES)"
          test "$size" -le "$APK_BUDGET_BYTES"
      - uses: actions/upload-artifact@v4
        with:
          name: rubi-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
