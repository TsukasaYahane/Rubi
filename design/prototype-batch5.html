<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rubi 第五批原型</title>
<style>
  :root{
    --bg:#000; --bg2:#1c1c1c; --bg3:#111; --fg:#fff; --fg2:#a6a6a6; --line:#333;
    --accent:#0050EF; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0a;color:var(--fg);font-family:Inter,'Noto Sans SC','Segoe UI',system-ui,sans-serif}
  .mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}

  .stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px}
  .stagebar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:1300px}
  .stagebar button{background:transparent;border:1px solid var(--line);color:var(--fg2);
    font:inherit;font-size:13px;padding:6px 12px;cursor:pointer;border-radius:0}
  .stagebar button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 窗口 */
  .win{background:var(--bg);width:1280px;height:800px;display:flex;flex-direction:column;
    border:1px solid var(--line);overflow:hidden;position:relative}
  .titlebar{height:28px;display:flex;align-items:center;padding:0 12px;
    font-size:11px;color:var(--fg2);border-bottom:1px solid var(--line);gap:10px}
  .body{flex:1;display:flex;min-height:0}

  /* 左侧导航 */
  .rail{width:196px;border-right:1px solid var(--line);display:flex;flex-direction:column;
    padding:14px 0;gap:2px;flex-shrink:0}
  .rail .brand{font-size:15px;letter-spacing:4px;font-weight:600;padding:0 16px 14px}
  .rail .item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:14px;
    color:var(--fg2);cursor:pointer;border-left:3px solid transparent}
  .rail .item.on{color:var(--fg);border-left-color:var(--accent);background:#0d0d0d}
  .rail .item:hover{color:var(--fg)}
  .rail .foot{margin-top:auto}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .topbar{display:flex;align-items:center;gap:14px;padding:12px 18px 8px;flex-shrink:0}
  .tabs{display:flex;gap:16px;align-items:baseline}
  .tabs span{font-size:20px;font-weight:300;color:var(--fg2);cursor:pointer}
  .tabs span.on{color:var(--fg)}
  .topbar .grow{flex:1}
  .ibtn{background:transparent;border:1px solid var(--line);color:var(--fg2);font:inherit;
    font-size:12px;padding:5px 9px;cursor:pointer;border-radius:0;display:inline-flex;gap:6px;align-items:center}
  .ibtn:hover{color:var(--fg);border-color:var(--fg2)}
  .ibtn.blue{color:var(--accent);border-color:var(--accent)}

  .summary{padding:0 18px 10px;font-size:12px;color:var(--fg2);display:flex;gap:10px;align-items:center;flex-shrink:0}
  .summary b{color:var(--fg);font-weight:600}
  .summary a{color:var(--accent);cursor:pointer;text-decoration:none}

  .scroll{flex:1;overflow:auto;padding:0 18px 18px}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .card{position:relative}
  .thumb{height:120px;background:#222;position:relative;display:flex;align-items:center;
    justify-content:center;color:#555;font-size:11px;outline:1px solid #2a2a2a}
  .card .t{font-size:13px;line-height:19px;margin-top:7px;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .m{font-size:11px;color:var(--fg2);margin-top:4px}
  .more{position:absolute;top:6px;right:6px;width:22px;height:22px;background:rgba(0,0,0,.72);
    color:#fff;border:0;cursor:pointer;font-size:14px;line-height:22px;text-align:center;padding:0}
  .more:hover{background:var(--accent)}
  .badge{position:absolute;left:0;bottom:0;background:var(--accent);color:#fff;font-size:10px;
    padding:1px 5px;letter-spacing:1px}
  .dur{position:absolute;right:0;bottom:0;background:rgba(0,0,0,.8);font-size:10px;padding:1px 5px}

  /* 浮层菜单 */
  .menu{position:absolute;background:#1a1a1a;border:1px solid #3a3a3a;min-width:168px;
    font-size:13px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.6)}
  .menu div{padding:9px 14px;cursor:pointer;color:#e6e6e6}
  .menu div:hover{background:var(--accent);color:#fff}
  .menu hr{border:0;border-top:1px solid #333;margin:4px 0}
  .menu .sub{color:var(--fg2);font-size:12px;padding-left:26px}

  /* 弹层 */
  .sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:50;
    display:flex;align-items:center;justify-content:center}
  .panel{background:#161616;border:1px solid #3a3a3a;width:520px;max-height:84%;
    display:flex;flex-direction:column}
  .panel h3{font-size:16px;font-weight:600;padding:14px 18px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  .panel h3 button{background:transparent;border:0;color:var(--fg2);font-size:16px;cursor:pointer}
  .panel .in{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
  .panel .foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;justify-content:flex-end}
  .btn{background:var(--accent);color:#fff;border:0;font:inherit;font-size:13px;font-weight:600;
    padding:9px 18px;cursor:pointer;border-radius:0}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg2);font-weight:400}

  /* 因子条 */
  .factor{display:flex;align-items:center;gap:10px;font-size:12px}
  .factor .n{width:104px;color:var(--fg2);flex-shrink:0}
  .factor .bar{flex:1;height:6px;background:#262626;position:relative}
  .factor .bar i{position:absolute;left:50%;top:0;bottom:0;background:var(--accent);display:block}
  .factor .bar i.neg{background:#c04a4a}
  .factor .v{width:44px;text-align:right;font-size:11px}

  /* 列表行 */
  .row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #222;
    font-size:13px}
  .row:hover{background:#141414}
  .row .grow{flex:1;min-width:0}
  .row .sub{font-size:11px;color:var(--fg2);margin-top:3px}
  .chip{font-size:10px;padding:1px 6px;border:1px solid var(--line);color:var(--fg2)}
  .chip.rule{border-color:#4a4a4a;color:#d0d0d0}

  /* 开关（半填充方块） */
  .sw{width:44px;height:22px;border:2px solid var(--fg);padding:2px;display:inline-flex;
    box-sizing:border-box;cursor:pointer;flex-shrink:0}
  .sw.off{border-color:var(--fg2);justify-content:flex-start;background:var(--fg2)}
  .sw.on{border-color:var(--accent);justify-content:flex-end;background:var(--accent)}
  .sw i{display:block;width:10px;height:14px;background:#fff}

  .hint{font-size:12px;color:var(--fg2);line-height:20px}
  .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;background:#1a1a1a;
    border:1px solid #3a3a3a;padding:9px 16px;font-size:12px;z-index:60;display:none}
  .toast.show{display:block}
  .clip{position:absolute;left:0;right:0;bottom:0;background:#101820;border-top:1px solid var(--accent);
    display:flex;align-items:center;gap:12px;padding:11px 18px;font-size:13px;z-index:30}
  .clip button{background:var(--accent);border:0;color:#fff;font:inherit;font-size:12px;
    padding:6px 14px;cursor:pointer}
  .clip .x{background:transparent;color:var(--fg2);cursor:pointer;border:0;font-size:16px}

  .cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cardbox{border:1px solid var(--line);padding:12px}
  .cardbox .h{font-size:14px;margin-bottom:6px}
  .cardbox .s{font-size:11px;color:var(--fg2);line-height:18px}
</style>
</head>
<body>
<div class="stage">
  <div class="stagebar" id="screens"></div>

  <div class="win" id="win">
    <div class="titlebar"><span class="mono">Rubi</span><span class="grow"></span><span class="mono">UWP · 1280 × 800</span></div>
    <div class="body">
      <div class="rail">
        <div class="brand mono">RUBI</div>
        <div class="item on">首页</div>
        <div class="item">关注</div>
        <div class="item">直播</div>
        <div class="item">消息</div>
        <div class="item">我的</div>
        <div class="foot">
          <div class="item">搜索</div>
        </div>
      </div>
      <div class="main" id="main"></div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="hint" id="note" style="max-width:1280px"></div>
</div>

<script>
const NOTE = {
  home:'首页顶栏：推荐 / 热门 / 排行 / 分区 / 影视，右侧「竖屏」「刷新」。卡片右上角 ⋯（或右键、长按）打开菜单；状态行显示本次刷新的摘要，点「被过滤 N 条」进过滤记录页。底部出现的蓝色条是剪贴板识别。',
  why:'每张卡片都能看「为什么推荐」：八个因子的分值条，正分钴蓝、负分红。右上角可以直接「不感兴趣」，也就是加入屏蔽，或只是降低这类内容的权重。',
  filtered:'被过滤内容：只记录不展示。每条写明命中哪条规则；标成误杀只记一笔，不改规则——规则表仍然只在设置里编辑。',
  lists:'播放列表：多个列表可切换，默认列表不能删。模式四选一；每项可上移、下移、移除。下面是「播放全部」和「听全部」，临时列表在离开播放页时自动清掉。',
  listen:'听视频：从播放列表的「听全部」或播放页「听」进入。播放队列按当前列表排，听完自动接下一个；定时暂停、倍速、音量跟这个页面走。',
  subs:'订阅的合集：列出已订阅的合集和新视频数，点开看视频；编辑可多选取消订阅。',
  upsearch:'UP 空间搜索：空间页顶部搜索框，结果分全部 / 视频 / 专栏 / 动态，默认只显示各类型前几条，可以展开。',
  follow:'关注页：带搜索（按名字筛横栏和动态）和「同步到推荐」；「全部关注」带搜索，可按最近更新或关注时间排序。'
};

function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild;}
function cards(n, seed){
  const out=[];
  for(let i=0;i<n;i++){
    const k=(i+seed)%6;
    out.push(`<div class="card">
      <div class="thumb">封面 ${i+1}
        <span class="dur mono">${12+k*3}:${String((k*7)%60).padStart(2,'0')}</span>
        ${i===1?'<span class="badge">兴趣匹配</span>':''}
      </div>
      <button class="more" data-i="${i}">⋯</button>
      <div class="t">示例视频标题 ${i+1}：这一行会折成两行显示，用来检查卡片间距</div>
      <div class="m mono">${(12.3+k*8).toFixed(1)}万 · UP ${String.fromCharCode(65+k)}</div>
    </div>`);
  }
  return out.join('');
}

const SCREENS = {};
let current='home';

SCREENS.home = () => ({
  html:`<div class="topbar">
      <div class="tabs" id="tabs">
        <span class="on">推荐</span><span>热门</span><span>排行</span><span>分区 ▾</span><span>影视 ▾</span>
      </div>
      <div class="grow"></div>
      <button class="ibtn blue">▯ 竖屏</button>
      <button class="ibtn">↻ 刷新</button>
    </div>
    <div class="summary">
      <span>刷新：新增 <b>24</b> 条 · 过滤 <b>37</b> 条 · 重复 <b>6</b> 条</span>
      <div class="grow"></div>
      <a id="toFiltered">被过滤 37 条 ›</a>
    </div>
    <div class="scroll"><div class="grid">${cards(8,0)}</div></div>
    <div class="clip" id="clip">
      <span>剪贴板里有一个视频链接 · <span class="mono" style="color:#a6a6a6">b23.tv/ackm2kb</span></span>
      <div class="grow" style="flex:1"></div>
      <button>打开</button><button class="x" id="clipx">✕</button>
    </div>`,
  mount(root){
    root.querySelectorAll('.more').forEach(b=>{
      b.onclick=e=>{e.stopPropagation();openCardMenu(b, +b.dataset.i)};
    });
    root.querySelector('#toFiltered').onclick=()=>go('filtered');
    root.querySelector('#clipx').onclick=()=>root.querySelector('#clip').remove();
  }
});

let menuEl=null;
function closeMenu(){ if(menuEl){menuEl.remove(); menuEl=null;} }
function openCardMenu(btn, i){
  closeMenu();
  const m=el(`<div class="menu">
    <div data-a="why">为什么推荐</div>
    <div data-a="dislike">不感兴趣 ›</div>
    <hr>
    <div data-a="later">稍后再看</div>
    <div data-a="copy">复制链接</div>
  </div>`);
  const main=document.querySelector('.main');
  const r=btn.getBoundingClientRect(), mr=main.getBoundingClientRect();
  m.style.left=Math.min(r.left-mr.left-140, mr.width-190)+'px';
  m.style.top=(r.bottom-mr.top+4)+'px';
  main.appendChild(m); menuEl=m;
  m.querySelectorAll('div[data-a]').forEach(d=>{
    d.onclick=ev=>{
      ev.stopPropagation();
      const a=d.dataset.a;
      closeMenu();
      if(a==='why') openWhy(i);
      if(a==='dislike') openDislike(i);
      if(a==='later') toast('已加入稍后再看');
      if(a==='copy') toast('已复制链接');
    };
  });
}

function openWhy(i){
  const rows=[
    ['兴趣匹配', 0.9, '+0.34'],['关注 UP', 0.0, '0.00'],['新鲜度', 0.62, '+0.18'],
    ['话题热度', 0.4, '+0.11'],['内容质量', 0.75, '+0.22'],['探索奖励', 0.2, '+0.05'],
    ['不感兴趣惩罚', -0.1, '−0.03'],['重复曝光', -0.35, '−0.12']
  ];
  const bar=(v)=>{
    const w=Math.abs(v)*46;
    return v>=0
      ? `<i class="${v<0?'neg':''}" style="left:50%;width:${w}%"></i>`
      : `<i class="neg" style="left:${50-w}%;width:${w}%"></i>`;
  };
  const p=el(`<div class="sheet"><div class="panel">
    <h3>为什么推荐 <button>✕</button></h3>
    <div class="in">
      <div style="font-size:13px;line-height:20px">示例视频标题 ${i+1}：这一行会折成两行显示，用来检查卡片间距</div>
      ${rows.map(([n,v,t])=>`<div class="factor"><span class="n">${n}</span>
        <span class="bar">${bar(v)}</span><span class="v mono">${t}</span></div>`).join('')}
      <div class="hint">总分 0.75，排在本次推荐的第 ${i+3} 位。因子权重可以在「我的 › 设置 › 推荐」里调。</div>
    </div>
    <div class="foot">
      <button class="btn ghost" data-a="dislike">不感兴趣…</button>
      <button class="btn" data-a="close">知道了</button>
    </div>
  </div></div>`);
  p.querySelector('h3 button').onclick=()=>p.remove();
  p.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.a; p.remove();
    if(a==='dislike') openDislike(i); else toast('已关闭');
  });
  p.onclick=e=>{ if(e.target===p) p.remove(); };
  document.querySelector('.main').appendChild(p);
}

function openDislike(i){
  const p=el(`<div class="sheet"><div class="panel" style="width:420px">
    <h3>不感兴趣 <button>✕</button></h3>
    <div class="in">
      <div class="hint">选一个原因。选完这条会从推荐里消失，并记进屏蔽名单。</div>
      <div class="menu" style="position:static;box-shadow:none;border-color:#333;min-width:0">
        <div data-r="up">这个 UP 主</div>
        <div data-r="tag">这个分区 / 标签</div>
        <div data-r="title">这类标题</div>
        <div data-r="seen">已经看过</div>
      </div>
    </div>
    <div class="foot"><button class="btn ghost" data-a="close">取消</button></div>
  </div></div>`);
  p.querySelector('h3 button').onclick=()=>p.remove();
  p.querySelector('[data-a=close]').onclick=()=>p.remove();
  p.querySelectorAll('[data-r]').forEach(d=>d.onclick=()=>{
    const card=document.querySelectorAll('.card')[i];
    p.remove();
    if(card){card.style.transition='opacity .25s';card.style.opacity='0';
      setTimeout(()=>card.remove(),260);}
    toast('已不感兴趣 · 这个视频不会再出现在推荐里');
  });
  p.onclick=e=>{ if(e.target===p) p.remove(); };
  document.querySelector('.main').appendChild(p);
}

SCREENS.why = () => ({
  html:`<div class="topbar"><div class="tabs"><span class="on">推荐</span><span>热门</span><span>排行</span></div>
    <div class="grow"></div><button class="ibtn">↻ 刷新</button></div>
    <div class="scroll"><div class="grid">${cards(4,0)}</div></div>`,
  mount(root){
    setTimeout(()=>openWhy(0), 60);
  }
});

SCREENS.filtered = () => ({
  html:`<div class="topbar"><div class="tabs"><span class="on">被过滤内容</span></div>
    <div class="grow"></div><button class="ibtn">只显示误杀</button></div>
    <div class="summary"><span>最近 24 小时：视频 <b>31</b> 条 · 弹幕 <b>4</b> 条 · 评论 <b>2</b> 条</span></div>
    <div class="scroll" style="padding:0">
      ${[
        ['商业推广视频','戴它，不是为了好看，是为了让声音更有分量','promotion.bihuo_card','03:12'],
        ['广告卡片','首页横幅：双十一数码专场','promotion.ad_card','03:12'],
        ['广告卡片','广告 · 某品牌精华水','promotion.ad_card','02:51'],
        ['指令弹幕','【投票】你更喜欢哪一款','danmaku.command','02:44'],
        ['置顶带货评论','置顶 · 工学椅链接见评论区','comment.pinned_goods','01:30'],
        ['商业推广视频','这款键盘用了三个月，说说真实感受','promotion.bihuo_card','00:58']
      ].map(([k,t,r,tm])=>`<div class="row">
        <span class="chip">${k}</span>
        <div class="grow"><div>${t}</div><div class="sub">规则 <span class="chip rule mono">${r}</span></div></div>
        <span class="mono sub" style="color:#a6a6a6">${tm}</span>
        <button class="ibtn">误杀</button>
      </div>`).join('')}
    </div>`,
  mount(root){
    root.querySelectorAll('.ibtn').forEach(b=>b.onclick=()=>toast('已记为误杀，规则没有改'));
  }
});

/* ---------- 播放列表 ---------- */
const LIST_DATA = {
  '默认':   ['如何拍出史上最糟糕的《哥斯拉》？','小猫以前的工作很辛苦吧','格雷的比赛复盘 · 第 28 期'],
  '晚上听': ['K/DA 音乐现场 3:20 版','钢琴改编：千本樱','深夜电台 第 12 期']
};
let curList='默认', mode='顺序', temp=false;

SCREENS.lists = () => ({
  html:`<div class="topbar">
      <div class="tabs"><span class="on">播放列表</span></div>
      <div class="grow"></div>
      <button class="ibtn" data-a="new">＋ 新建列表</button>
    </div>
    <div class="summary" id="listtabs"></div>
    <div class="summary">
      <span>播放模式</span>
      <div id="modes" style="display:flex;gap:6px"></div>
      <div class="grow"></div>
      <span class="hint" id="tempnote"></span>
    </div>
    <div class="scroll" style="padding:0 0 0 0" id="items"></div>
    <div class="summary" style="border-top:1px solid #222;padding:10px 18px">
      <button class="btn" data-a="play">▶ 播放全部</button>
      <button class="btn ghost" data-a="listen">听全部</button>
      <div class="grow"></div>
      <span class="hint">列表存本地，随配置备份导出</span>
    </div>`,
  mount(root){
    const draw=()=>{
      root.querySelector('#listtabs').innerHTML =
        Object.keys(LIST_DATA).map(n=>
          `<button class="ibtn ${n===curList?'blue':''}" data-l="${n}">${n} · ${LIST_DATA[n].length}</button>`
        ).join('') +
        `<button class="ibtn" data-l="__edit" style="border-style:dashed">重命名 / 删除</button>`;
      root.querySelector('#modes').innerHTML = ['顺序','列表循环','单曲循环','随机'].map(m=>
        `<button class="ibtn ${m===mode?'blue':''}" data-m="${m}">${m}</button>`).join('');
      root.querySelector('#tempnote').textContent = temp ? '临时列表 · 离开播放页后自动清空' : '';
      const items=LIST_DATA[curList];
      root.querySelector('#items').innerHTML = items.length? items.map((t,i)=>`
        <div class="row">
          <span class="mono" style="color:#a6a6a6;width:22px">${i+1}</span>
          <div class="thumb" style="width:96px;height:54px;flex-shrink:0;font-size:10px">封面</div>
          <div class="grow"><div>${t}</div><div class="sub mono">${
            ['08:12','03:20','14:05','21:40','06:58'][i%5]}</div></div>
          <button class="ibtn" data-mv="up" data-i="${i}" ${i===0?'disabled':''}>↑</button>
          <button class="ibtn" data-mv="down" data-i="${i}" ${i===items.length-1?'disabled':''}>↓</button>
          <button class="ibtn" data-mv="del" data-i="${i}">移除</button>
        </div>`).join('')
        : `<div class="row"><div class="hint">这个列表还是空的。在任意视频卡片上右键可以加进来。</div></div>`;
      bind();
    };
    const bind=()=>{
      root.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{
        const l=b.dataset.l;
        if(l==='__edit'){
          if(curList==='默认'){ toast('默认列表不能重命名或删除'); return; }
          const n=prompt('新名称（留空则删除这个列表）', curList);
          if(n===null) return;
          if(!n.trim()){ delete LIST_DATA[curList]; curList='默认'; toast('已删除列表'); }
          else { LIST_DATA[n.trim()]=LIST_DATA[curList]; delete LIST_DATA[curList]; curList=n.trim(); }
        } else { curList=l; }
        draw();
      });
      root.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; draw(); });
      root.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i, a=b.dataset.mv, arr=LIST_DATA[curList];
        if(a==='del') arr.splice(i,1);
        if(a==='up' && i>0) [arr[i-1],arr[i]]=[arr[i],arr[i-1]];
        if(a==='down' && i<arr.length-1) [arr[i+1],arr[i]]=[arr[i],arr[i+1]];
        draw();
      });
    };
    root.querySelector('[data-a=new]').onclick=()=>{
      const n=prompt('新列表名称（最多 20 字）','新列表');
      if(!n||!n.trim()) return;
      if(LIST_DATA[n.trim()]){ toast('这个名字已经有了'); return; }
      LIST_DATA[n.trim()]=[]; curList=n.trim();
      draw();
    };
    root.querySelector('[data-a=play]').onclick=()=>{ temp=true; draw(); toast('已作为临时列表开始播放（'+mode+'）'); };
    root.querySelector('[data-a=listen]').onclick=()=>go('listen');
    draw();
  }
});

<script>
function toast(s){
  const t=document.getElementById('toast');
  t.textContent=s; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), 2400);
}
function go(name){
  current=name;
  const main=document.getElementById('main');
  main.innerHTML='';
  closeMenu();
  const s=SCREENS[name]();
  main.innerHTML=s.html;
  if(s.mount) s.mount(main);
  document.getElementById('note').textContent=NOTE[name]||'';
  document.querySelectorAll('#screens button').forEach(b=>b.classList.toggle('on', b.dataset.s===name));
}
window.addEventListener('DOMContentLoaded',()=>{
  const bar=document.getElementById('screens');
  [['home','首页 · 刷新摘要 / 卡片菜单'],['why','为什么推荐'],['filtered','被过滤内容'],
   ['lists','播放列表'],['listen','听视频'],['subs','订阅的合集'],
   ['upsearch','UP 空间搜索'],['follow','关注页 / 全部关注']].forEach(([k,label])=>{
    const b=document.createElement('button'); b.dataset.s=k; b.textContent=label;
    b.onclick=()=>go(k); bar.appendChild(b);
  });
  document.addEventListener('click', e=>{ if(menuEl && !menuEl.contains(e.target)) closeMenu(); });
  go('home');
});
</script>
