<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rubi 听视频窗口原型</title>
<style>
  :root{--bg:#000;--bg2:#1c1c1c;--fg:#fff;--fg2:#a6a6a6;--line:#333;--accent:#0050EF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0a;color:var(--fg);font-family:Inter,'Noto Sans SC','Segoe UI',system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px}
  .bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .bar button{background:transparent;border:1px solid var(--line);color:var(--fg2);font:inherit;font-size:13px;
              padding:6px 12px;cursor:pointer}
  .bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .win{width:1180px;height:760px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column}
  .title{height:30px;display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--fg2);
         border-bottom:1px solid var(--line);font-family:ui-monospace,monospace}
  .body{flex:1;display:flex;min-height:0}
  .side{width:196px;border-right:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:2px}
  .side .b{font-size:15px;letter-spacing:4px;font-weight:600;padding:0 16px 14px;font-family:ui-monospace,monospace}
  .side .i{padding:9px 16px;font-size:14px;color:var(--fg2)}
  .side .i.on{color:#fff;border-left:3px solid var(--accent);background:#0d0d0d}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .head{display:flex;align-items:center;gap:14px;padding:12px 20px 6px}
  .head .t{font-size:20px;font-weight:300}
  .head .grow{flex:1}
  .head .x{background:transparent;border:0;color:var(--fg2);font:inherit;font-size:13px;cursor:pointer}
  .stage{flex:1;display:flex;min-height:0}
  .now{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 24px}
  .cover{width:340px;height:340px;background:#222;display:flex;align-items:center;justify-content:center;
         color:#555;font-size:12px;outline:1px solid #2a2a2a}
  .song{font-size:20px;font-weight:600;text-align:center;max-width:520px}
  .who{font-size:13px;color:var(--fg2);margin-top:6px}
  .seek{width:520px;margin-top:6px}
  .track{height:4px;background:#262626;position:relative;cursor:pointer}
  .track i{position:absolute;left:0;top:0;bottom:0;width:36%;background:var(--accent);display:block}
  .times{display:flex;justify-content:space-between;font-size:11px;color:var(--fg2);margin-top:6px;
          font-family:ui-monospace,monospace}
  .acts{display:flex;align-items:center;justify-content:space-between;gap:0;margin-top:10px;width:520px}
  .acts .b{background:transparent;border:0;color:var(--fg2);font:inherit;font-size:22px;cursor:pointer;
           padding:6px}
  .acts .play{width:72px;height:72px;background:var(--accent);border:0;color:#fff;font-size:24px;cursor:pointer;
              display:flex;align-items:center;justify-content:center}
  .under{font-size:12px;color:var(--fg2);text-align:center;width:520px;margin-top:8px}
  .queue{width:360px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .queue .h{padding:12px 16px;font-size:13px;color:var(--fg2);border-bottom:1px solid #222;display:flex;
             justify-content:space-between}
  .queue .list{overflow:auto;flex:1}
  .queue .row{display:flex;gap:10px;padding:9px 16px;font-size:13px;border-bottom:1px solid #161616;cursor:pointer}
  .queue .row.on{background:#0d1424;color:#7ea6ff}
  .queue .row .n{color:#666;width:18px;font-family:ui-monospace,monospace}
  .queue .row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .queue .row .d{color:#666;font-size:11px;font-family:ui-monospace,monospace}
  .note{max-width:1180px;font-size:12px;color:var(--fg2);line-height:20px}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="win" id="win">
  <div class="title" id="wintitle">Rubi</div>
  <div class="body">
    <div class="main">
      <div class="head">
        <button class="x">‹ 返回</button>
        <div class="t" id="headt">听视频</div>
        <div class="grow"></div>
      </div>
      <div class="stage">
        <div class="now">
          <div class="cover" id="cover">封面</div>
          <div>
            <div class="song" id="song">单排完美S 战两把睡觉</div>
            <div class="who" id="who">某 UP 主 · 第 1 / 6 首</div>
          </div>
          <div class="seek">
            <div class="track" id="track"><i id="fill"></i></div>
            <div class="times"><span id="at">01:12</span><span id="end">03:48</span></div>
          </div>
          <div class="acts">
            <button class="b" id="modeBtn" title="播放模式"></button>
            <button class="b" title="上一首">⏮</button>
            <button class="play" id="play">▶︎</button>
            <button class="b" title="下一首">⏭</button>
            <button class="b" id="toVideoBtn" title="看视频">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="3" y="6" width="18" height="12"/><polygon points="10,9.5 15,12 10,14.5" fill="currentColor" stroke="none"/>
              </svg>
            </button>
          </div>
          <div class="under" id="under">列表循环</div>
        </div>
        <div class="queue" id="queue">
          <div class="h"><span>接下来</span><span id="qn">6 首</span></div>
          <div class="list" id="qlist"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="note">
  点「播放 / 暂停」按钮可以切换状态；点队列里的任意一首会切过去。
  「看视频」把窗口切回普通的视频页，从当前进度接着放。
</div>
<script>
const ITEMS = [
  ['单排完美S 战两把睡觉','03:48'],
  ['这个赛季的改动值得说一说','12:05'],
  ['深夜电台 第 12 期','48:20'],
  ['为什么第三局要换线','09:31'],
  ['钢琴改编：千本樱','04:02'],
  ['赛后复盘 · 瑞士轮第二轮','21:17']
];
let at = 0, playing = true, secs = 72;
const modeNames = ['顺序','列表循环','单曲循环','随机'];
let mode = 1;

function drawQueue(){
  document.getElementById('qlist').innerHTML = ITEMS.map(([t,d],i)=>
    `<div class="row ${i===at?'on':''}" data-i="${i}"><span class="n">${i+1}</span>
       <span class="t">${t}</span><span class="d">${d}</span></div>`).join('');
  document.getElementById('qn').textContent = ITEMS.length + ' 首';
  document.querySelectorAll('#qlist .row').forEach(r=>{
    r.onclick = () => { at = +r.dataset.i; secs = 0; playing = true; draw(); };
  });
}
const MODE_ICONS = [
  // 顺序: an arrow that stops at the end
  '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><line x1="3" y1="9" x2="18" y2="9"/><polyline points="15,6 18,9 15,12"/><line x1="3" y1="15" x2="12" y2="15"/><rect x="19" y="12" width="2" height="6"/></svg>',
  // 列表循环: round trip around a list
  '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h13v3l3-4-3-4v3H4z"/><path d="M20 16H7v-3l-3 4 3 4v-3h13z"/></svg>',
  // 单曲循环: the same line, twice around one mark
  '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 9h11v3l3-4-3-4v3H5z"/><path d="M19 15H8v-3l-3 4 3 4v-3h11z"/><rect x="11.2" y="10.4" width="1.6" height="3.2"/></svg>',
  // 随机: two crossing lines
  '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7h4l10 10h4"/><path d="M18 14l3 3-3 3"/><path d="M3 17h4"/><path d="M13 7h4"/><path d="M18 4l3 3-3 3"/></svg>'
];

function fmt(s){ const m = Math.floor(s/60), x = s%60; return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function draw(){
  document.getElementById('song').textContent = ITEMS[at][0];
  document.getElementById('who').textContent = '某 UP 主 · 第 ' + (at+1) + ' / ' + ITEMS.length + ' 首';
  document.getElementById('cover').textContent = '封面 ' + (at+1);
  const total = ITEMS[at][1].split(':');
  const endSecs = (+total[0])*60 + (+total[1]);
  document.getElementById('at').textContent = fmt(secs);
  document.getElementById('end').textContent = ITEMS[at][1];
  document.getElementById('fill').style.width = (100*secs/endSecs).toFixed(1) + '%';
  document.getElementById('play').textContent = playing ? '⏸' : '▶︎';
  document.getElementById('under').textContent = modeNames[mode];
  document.getElementById('modeBtn').innerHTML = MODE_ICONS[mode];
  document.getElementById('modeBtn').title = modeNames[mode];
  drawQueue();
}
setInterval(()=>{ if(playing){ secs = (secs+1) % 600; draw(); } }, 1000);
document.getElementById('play').onclick = ()=>{ playing = !playing; draw(); };
document.querySelectorAll('.acts .b')[0].onclick = ()=>{ mode = (mode+1) % 4; draw(); };
document.querySelectorAll('.acts .b')[1].onclick = ()=>{ at = (at+ITEMS.length-1)%ITEMS.length; secs=0; draw(); };
document.querySelectorAll('.acts .b')[3].onclick = ()=>{ at = (at+1)%ITEMS.length; secs=0; draw(); };
document.getElementById('track').onclick = (e)=>{
  const r = e.currentTarget.getBoundingClientRect();
  secs = Math.round((e.clientX - r.left) / r.width * 228); draw();
};
draw();
</script>
</body>
</html>
